<!DOCTYPE html>
<html lang="en">

<head>
  <title>Aircraft Hours Status - SkyOpsAero</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

  <style>
    :root {
      --status-ink: #172033;
      --status-muted: #687386;
      --status-line: #dce2ea;
      --status-blue: #1457d9;
      --status-blue-soft: #eaf1ff;
    }

    body {
      min-height: 100vh;
      color: var(--status-ink);
      background:
        radial-gradient(circle at 85% 0%, rgba(20, 87, 217, .10), transparent 26rem),
        #f3f5f8;
    }

    .page-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .eyebrow {
      margin-bottom: .35rem;
      color: var(--status-blue);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .page-copy {
      max-width: 44rem;
      color: var(--status-muted);
    }

    .refresh-wrap {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: end;
      gap: .4rem;
    }

    .aircraft-card {
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--status-line);
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 .35rem 1rem rgba(23, 32, 51, .06);
    }

    .aircraft-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--status-line);
    }

    .registration {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: .035em;
    }

    .metric-badge {
      padding: .38rem .62rem;
      border-radius: 999px;
      color: var(--status-blue);
      background: var(--status-blue-soft);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .hours-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
      padding: 1rem 1.1rem .8rem;
    }

    .hours-block {
      min-width: 0;
      padding: .8rem;
      border-radius: .8rem;
      background: #f7f8fa;
    }

    .hours-block.remaining {
      grid-column: 1 / -1;
      background: var(--status-blue-soft);
    }

    .metric-label {
      color: var(--status-muted);
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: .2rem;
      font-size: 1.55rem;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      line-height: 1.15;
    }

    .remaining .metric-value {
      color: var(--status-blue);
      font-size: 2rem;
    }

    .remaining.due-soon {
      background: #fff4d6;
    }

    .remaining.due-soon .metric-value {
      color: #8a5600;
    }

    .remaining.overdue {
      background: #fdebec;
    }

    .remaining.overdue .metric-value {
      color: #b4232f;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem .85rem;
      padding: 0 1.1rem 1rem;
      color: var(--status-muted);
      font-size: .85rem;
    }

    .card-meta-label {
      color: var(--status-ink);
      font-weight: 700;
    }

    .empty-state {
      padding: 3rem 1.25rem;
      border: 1px dashed #b8c1cf;
      border-radius: 1rem;
      color: var(--status-muted);
      background: rgba(255, 255, 255, .65);
      text-align: center;
    }

    .skeleton-card {
      height: 18rem;
      border-radius: 1rem;
      background: linear-gradient(90deg, #e5e9ef 25%, #f7f8fa 38%, #e5e9ef 63%);
      background-size: 400% 100%;
      animation: shimmer 1.35s ease infinite;
    }

    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: 0 0; }
    }

    @media (max-width: 575.98px) {
      .page-intro {
        align-items: stretch;
        flex-direction: column;
      }

      .refresh-wrap {
        align-items: stretch;
      }
    }
  </style>

  <script src="js/auth.js" defer></script>
  <script src="js/logout.js" defer></script>
  <script src="js/admin-guard.js" defer></script>
  <script src="js/loadNavbar.js?v=20260910" defer></script>
  <link rel="stylesheet" href="/css/styles.css?v=20260910-polish">
</head>

<body class="skyops-app" data-page-title="Aircraft Hours Status">
  <header class="site-heading container-fluid p-2 bg-primary text-white text-center">
    <h1 class="h2 mb-0">AIRCRAFT HOURS STATUS</h1>
  </header>

  <div id="navbar-placeholder"></div>

  <main class="container py-4">
    <section class="page-intro" aria-labelledby="fleetHeading">
      <div>
        <div class="eyebrow">FlightLogs</div>
        <h2 id="fleetHeading" class="h3 mb-2">Fleet service hours</h2>
        <p class="page-copy mb-0">Latest recorded hours and the next service point for each aircraft.</p>
      </div>

      <div class="refresh-wrap">
        <button id="refreshStatus" class="btn btn-primary" type="button">Refresh</button>
        <span id="lastUpdated" class="small text-muted" aria-live="polite"></span>
      </div>
    </section>

    <div id="statusError" class="alert alert-danger d-none" role="alert"></div>

    <div id="statusSkeleton" class="row g-3" aria-label="Loading aircraft hours">
      <div class="col-12 col-md-6 col-xl-4"><div class="skeleton-card"></div></div>
      <div class="col-12 col-md-6 col-xl-4"><div class="skeleton-card"></div></div>
      <div class="col-12 col-md-6 col-xl-4"><div class="skeleton-card"></div></div>
    </div>

    <div id="aircraftCards" class="row g-3 d-none"></div>
    <div id="emptyStatus" class="empty-state d-none">No aircraft hour records were found in FlightLogs.</div>
  </main>

  <script>
    const FLIGHT_LOG_STATUS_URL = "https://rj7w2wkpgj.execute-api.eu-west-2.amazonaws.com/aircraft_status";
    const el = id => document.getElementById(id);

    function numberOrNull(value) {
      if (value === null || value === undefined || value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function formatHours(value) {
      const hours = numberOrNull(value);
      return hours === null ? "—" : hours.toFixed(1);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "No flight date recorded";
      const date = new Date(`${String(value).slice(0, 10)}T00:00:00`);
      if (Number.isNaN(date.getTime())) return String(value);
      return `Latest flight ${date.toLocaleDateString([], { day: "2-digit", month: "short", year: "numeric" })}`;
    }

    function remainingState(value) {
      const hours = numberOrNull(value);
      if (hours === null) return "";
      if (hours <= 0) return "overdue";
      if (hours <= 10) return "due-soon";
      return "";
    }

    function formatLoggedAt(value) {
      if (!value) return "Not recorded";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Not recorded";
      return new Intl.DateTimeFormat("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
        timeZone: "Europe/London",
        timeZoneName: "short"
      }).format(date);
    }

    function normalizeResponse(data) {
      const rows = Array.isArray(data)
        ? data
        : data?.aircraftStatus || data?.items || data?.Items || [];
      return Array.isArray(rows)
        ? rows.filter(row => String(row?.aircraft || "").toUpperCase() !== "G-AVYL")
        : [];
    }

    function renderCard(item) {
      const aircraft = escapeHtml(item?.aircraft || "Unknown");
      const isFlightHours = String(item?.metric || "").toUpperCase() === "FLIGHT_HOURS";
      const metric = isFlightHours ? "Flight hours" : "Tacho hours";
      const remaining = numberOrNull(item?.remainingHours);
      const state = remainingState(remaining);

      return `
        <div class="col-12 col-md-6 col-xl-4">
          <article class="aircraft-card">
            <div class="aircraft-card-head">
              <div class="registration">${aircraft}</div>
              <span class="metric-badge">${metric}</span>
            </div>

            <div class="hours-grid">
              <div class="hours-block">
                <div class="metric-label">Current ${metric}</div>
                <div class="metric-value">${formatHours(item?.currentHours)}</div>
              </div>

              <div class="hours-block">
                <div class="metric-label">Next service due</div>
                <div class="metric-value">${formatHours(item?.nextServiceDueAt)}</div>
              </div>

              <div class="hours-block remaining ${state}">
                <div class="metric-label">Hours remaining</div>
                <div class="metric-value">${formatHours(remaining)}</div>
              </div>
            </div>

            <div class="card-meta">
              <span>${escapeHtml(formatDate(item?.lastFlightDate))}</span>
              <span><span class="card-meta-label">PIC</span> ${escapeHtml(item?.lastFlightPic || "Not recorded")}</span>
              <span><span class="card-meta-label">Logged</span> ${escapeHtml(formatLoggedAt(item?.lastFlightLoggedAt))}</span>
            </div>
          </article>
        </div>
      `;
    }

    function setLoading(isLoading) {
      el("statusSkeleton").classList.toggle("d-none", !isLoading);
      const refresh = el("refreshStatus");
      refresh.disabled = isLoading;
      refresh.textContent = isLoading ? "Refreshing…" : "Refresh";
    }

    function showError(message) {
      const box = el("statusError");
      box.textContent = message || "";
      box.classList.toggle("d-none", !message);
    }

    async function waitForAuthFetch(maxMs = 2500) {
      const started = Date.now();
      while (Date.now() - started < maxMs) {
        if (typeof window.authFetch === "function") return;
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      throw new Error("Authentication is not ready.");
    }

    async function loadAircraftStatus() {
      setLoading(true);
      showError("");
      el("aircraftCards").classList.add("d-none");
      el("emptyStatus").classList.add("d-none");

      try {
        await waitForAuthFetch();
        const response = await window.authFetch(FLIGHT_LOG_STATUS_URL, {
          method: "GET",
          cache: "no-store"
        });

        if (!response?.ok) {
          const message = await response?.text().catch(() => "");
          throw new Error(message || `FlightLogs request failed (${response?.status || "no response"}).`);
        }

        const items = normalizeResponse(await response.json());
        el("aircraftCards").innerHTML = items.map(renderCard).join("");
        el("aircraftCards").classList.toggle("d-none", items.length === 0);
        el("emptyStatus").classList.toggle("d-none", items.length !== 0);
        el("lastUpdated").textContent = `Updated ${new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        })}`;
      } catch (error) {
        console.error(error);
        showError("Unable to load aircraft hours from FlightLogs.");
      } finally {
        setLoading(false);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      el("refreshStatus").addEventListener("click", loadAircraftStatus);
      loadAircraftStatus();
    });
  </script>
</body>

</html>
